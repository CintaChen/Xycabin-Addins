  <rect x="55" y="849" width="1004" height="142" rx="12" fill="#fff" stroke="#d69428" stroke-width="2"/>
  
  <text x="111" y="891" font-size="17">22:41:45 当前工作簿不是 .xlsx … 请点「选择目标…」另选。</text>
  <use href="#horizontal-grip" y="1006"/>
  <rect x="55" y="1020" width="149" height="33" rx="8" fill="#2563eb"/><text x="65" y="1043" style="fill:white;font-size:16px">读取表头并预检</text>
  <rect x="215" y="1020" width="113" height="33" rx="8" fill="#e9eef5"/><text x="235" y="1043" class="small">执行合并</text>
  <rect x="339" y="1020" width="113" height="33" rx="8" fill="#e9eef5"/><text x="359" y="1043" class="small">取消操作</text>
  <rect x="463" y="1020" width="113" height="33" rx="8" fill="#e9eef5"/><text x="483" y="1043" class="small">确认操作</text>
