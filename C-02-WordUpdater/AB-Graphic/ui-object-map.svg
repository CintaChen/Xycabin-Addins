  <rect x="55" y="324" width="1004" height="120" rx="12" class="card"/>
  <rect x="67" y="336" width="980" height="27" class="head"/>
  <text x="80" y="355" font-size="16">来源工作簿</text><text x="369" y="355" font-size="16">工作表</text><text x="601" y="355" font-size="16">表头行</text><text x="770" y="355" font-size="16">状态</text>
  
  <rect x="55" y="456" width="117" height="35" rx="8" class="button"/><text x="65" y="480" font-size="16">添加来源…</text>
