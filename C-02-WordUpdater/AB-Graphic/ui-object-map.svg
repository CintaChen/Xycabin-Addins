  <circle cx="1146" cy="448" r="18" fill="#16876f" stroke="white" stroke-width="2"/><text x="1146" y="448" class="num">9</text>
  <text x="1178" y="455" style="font-size:22px;font-weight:600">数据网格</text>
  <path d="M1069 602H1105L1125 607" fill="none" stroke="#7890b2" stroke-width="2"/>
  <circle cx="1146" cy="607" r="18" fill="#7890b2" stroke="white" stroke-width="2"/><text x="1146" y="607" class="num">2</text>
  <text x="1178" y="614" style="font-size:22px;font-weight:600">布局容器</text>
  <path d="M1046 884H1125" fill="none" stroke="#2563eb" stroke-width="2"/>
  <circle cx="1146" cy="885" r="18" fill="#2563eb" stroke="white" stroke-width="2"/><text x="1146" y="885" class="num">6</text>
  <text x="1178" y="892" style="font-size:22px;font-weight:600">只读日志文本框</text>
  <path d="M1059 986H1125" fill="none" stroke="#d69428" stroke-width="2"/>
  <circle cx="1146" cy="986" r="18" fill="#d69428" stroke="white" stroke-width="2"/><text x="1146" y="986" class="num">3</text>
  <text x="1178" y="993" style="font-size:22px;font-weight:600">日志卡片</text>
  <text x="32" y="1097" class="small">编号在两张图之间共用；彩色轮廓仅用于定位。文本框、日志和网格也可交互，本图按讲解用途分组。</text>
