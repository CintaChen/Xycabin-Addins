<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="660" viewBox="0 0 1480 660">
<title>程序新生成工作表：表头与完整数据列宽适配</title>
<desc>OCR提取结果四列构造示例，非真实WPS截图。表头居中、加粗、不换行；列AutoFit测量表头和全部数据，最后一行包含最长内容。极长正文达到宿主列宽上限时仅正文换行并适配行高。</desc>
<style>text{font-family:'Microsoft YaHei UI','Microsoft YaHei',sans-serif;fill:#17324d;font-size:22px} .title{font-size:32px;font-weight:700} .note{font-size:20px;fill:#52667d} .header{font-size:22px;font-weight:700;text-anchor:middle} .cell{font-size:20px;text-anchor:middle} .row{font-size:18px;fill:#6b7a90;text-anchor:middle}</style>
