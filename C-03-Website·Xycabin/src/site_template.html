});

function renderGuide(printAll){

 if(!count)fill(panel,node("p","empty",T.guide_empty));id("clear-search").hidden=!id("guide-search").value;

function columns(){if(innerWidth<=760)id("workflow-steps").style.gridTemplateColumns="repeat(2,minmax(0,1fr))";else if(innerWidth<=980)id("workflow-steps").style.gridTemplateColumns="repeat(3,minmax(0,1fr))";else id("workflow-steps").style.gridTemplateColumns="repeat("+Math.min(D.workflow.length,5)+",minmax(0,1fr))"}addEventListener("resize",columns);columns();
D.future.forEach(function(s){var item=fill(id("future-items"),node("article","future"));fill(item,node("h3","",s.title));fill(item,node("p","",s.text));fill(item,node("span","badge",T.future_label))});
function themeState(){var dark=document.documentElement.dataset.theme==="dark";id("theme-toggle").textContent=dark?"☀":"☾";id("theme-toggle").setAttribute("aria-label",dark?T.theme_light:T.theme);id("theme-toggle").setAttribute("title",dark?T.theme_light:T.theme);id("theme-toggle").setAttribute("aria-pressed",String(dark))}
id("theme-toggle").addEventListener("click",function(){var next=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=next;try{localStorage.setItem("xy-home-theme",next)}catch(e){}themeState()});

async function copyValue(value,successText){try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(value);toast(successText);return}}catch(e){}var previous=document.activeElement,box=node("textarea");box.value=value;box.style.position="fixed";box.style.opacity="0";document.body.appendChild(box);box.focus();box.select();var success=false;try{success=document.execCommand("copy")}catch(e){}box.remove();if(previous&&previous.focus)previous.focus();if(success)toast(successText);else manualCopy(value)}
