  <g clip-path="url(#grid-body)">
    <path d="M1233 443V700 M1320 443V700 M1149 489H1450 M1149 523H1450 M1149 557H1450 M1149 591H1450 M1149 625H1450 M1149 659H1450" fill="none" stroke="#e8edf4"/>
    <g font-size="16" fill="#52667d">
