      <text x="1159" y="647">示例6</text><text x="1245" y="647">字段 F</text><text x="1340" y="647">示意</text>
      <text x="1159" y="681">示例7</text><text x="1245" y="681">字段 G</text><text x="1340" y="681">示意</text>
    </g>
  </g>
